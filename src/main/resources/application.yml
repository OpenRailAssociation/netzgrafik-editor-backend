spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI}
  jooq:
    sql-dialect: ${JOOQ_SQL_DIALECT}
  flyway:
    enabled: ${FLYWAY_ENABLED}
    fail-on-missing-locations: ${FLYWAY_FAIL_ON_MISSING_LOCATIONS}
    locations: ${FLYWAY_LOCATIONS}
  datasource:
    driver-class-name: ${DB_DRIVER_CLASS_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    url: jdbc:postgresql://${DB_HOST}/${DB_NAME}

endpoints:
  web:
    cors:
      path-mappings: ${CORS_PATH_MAPPINGS}
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
      allowed-methods: ${CORS_ALLOWED_METHODS}
      allowed-headers: ${CORS_ALLOWED_HEADERS}

logging:
  level:
    org.springframework: ${SPRING_LOG_LEVEL}

auth:
  audience:
    service-name: ${AUTH_SERVICE_NAME}

# only active in 'local' profile
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED}
